name: Build and Push Docker
on:
  release:
    types:
      - created
  push:
    branches:
      - main
      - feat/tts-support-docker
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to Github Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds all the images in a single BuildKit session so that the stages
      # they share are only built once. Tags and caches are defined in the bake
      # file: pushes to main get the 'latest' tags, releases get the
      # release-specific ones.
      - name: Build images (${{ matrix.arch }})
        uses: docker/bake-action@v6.9.0
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE: ${{ github.event_name == 'release' && github.event.release.name || '' }}
          SERVER_VERSION: ${{ github.event_name == 'release' && github.event.release.name || 'nightly' }}
        with:
          source: .
          files: docker/docker-bake.hcl
          push: true
          sbom: true

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: karakeep-web
            tags_latest: ghcr.io/yazdipour/karakeep-web:latest
            tags_release: ghcr.io/yazdipour/karakeep-web:${{ github.event.release.name }},ghcr.io/yazdipour/karakeep-web:release
          - name: karakeep-workers
            tags_latest: ghcr.io/yazdipour/karakeep-workers:latest
            tags_release: ghcr.io/yazdipour/karakeep-workers:${{ github.event.release.name }},ghcr.io/yazdipour/karakeep-workers:release
          - name: karakeep-cli
            tags_latest: ghcr.io/yazdipour/karakeep-cli:latest
            tags_release: ghcr.io/yazdipour/karakeep-cli:${{ github.event.release.name }},ghcr.io/yazdipour/karakeep-cli:release
          - name: karakeep-mcp
            tags_latest: ghcr.io/yazdipour/karakeep-mcp:latest
            tags_release: ghcr.io/yazdipour/karakeep-mcp:${{ github.event.release.name }},ghcr.io/yazdipour/karakeep-mcp:release
          - name: karakeep-aio
            tags_latest: ghcr.io/yazdipour/karakeep:latest
            tags_release: ghcr.io/yazdipour/karakeep:${{ github.event.release.name }},ghcr.io/yazdipour/karakeep:release
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to Github Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests for ${{ matrix.name }}
        env:
          TAGS_LATEST: ${{ matrix.tags_latest }}
          TAGS_RELEASE: ${{ matrix.tags_release }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
          IS_PUSH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          create_manifest() {
            local tag="$1"
            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          }

          # Only create 'latest' manifests on pushes to main
          if [[ "${IS_PUSH}" == "true" ]]; then
            IFS=',' read -ra latest_tags <<< "${TAGS_LATEST}"
            for tag in "${latest_tags[@]}"; do
              create_manifest "$tag"
            done
          fi

          # Only create release-specific manifests on releases
          if [[ "${IS_RELEASE}" == "true" ]]; then
            IFS=',' read -ra release_tags <<< "${TAGS_RELEASE}"
            for tag in "${release_tags[@]}"; do
              create_manifest "$tag"
            done
          fi
